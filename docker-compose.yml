services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook
      POSTGRES_DB: logbook
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only (pg_dump etc.); not exposed to the LAN

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env   # SECRET_KEY, BASE_URL, SMTP_PASSWORD — see .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://logbook:logbook@db:5432/logbook
    volumes:
      - ./uploads:/app/uploads
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    # Hot-reload in development — comment out for production
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
